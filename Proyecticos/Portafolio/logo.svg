<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Logo geométrico" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .face { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linejoin: round; }
    .eye  { transform-box: fill-box; transform-origin: center; animation: eye-blink 4s infinite; }
    @keyframes eye-blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }
  </style>

  <!-- Fondo y borde morado -->
  <circle cx="60" cy="60" r="56" fill="#1a1a1e" stroke="#6c5ce7" stroke-width="4"/>

  <g transform="translate(10 20)">
    <!-- Ojos ▷ ◁ -->
    <polygon class="face eye" points="25,12 40,22 25,32"/>
    <polygon class="face eye" points="75,12 60,22 75,32"/>

    <!-- Boca ▷ ◇ ◁ -->
    <polygon class="face" points="20,45 38,55 20,65"/>
    <polygon class="face" points="50,45 62,55 50,65 38,55"/>
    <polygon class="face" points="80,45 62,55 80,65"/>
  </g>
</svg>
